<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">Nova System Overview</title>
  <desc id="desc">A privacy-first self-hosted personal operations platform</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b19"/>
      <stop offset="0.5" stop-color="#15123a"/>
      <stop offset="1" stop-color="#321052"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.72" cy="0.43" r="0.62">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#8b5cf6" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#070b19" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#a78bfa" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="380" rx="28" fill="url(#halo)"/>
  <rect width="1400" height="380" rx="28" fill="url(#grid)"/>
  <g transform="translate(1015 190)">
    <circle r="112" fill="none" stroke="#a855f7" stroke-opacity="0.28" stroke-width="2"/>
    <circle r="78" fill="none" stroke="#22d3ee" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="8 10"/>
    <circle r="12" fill="#e879f9" filter="url(#glow)"/>
    <circle cx="0" cy="-112" r="6" fill="#22d3ee"/>
    <circle cx="78" cy="0" r="6" fill="#c4b5fd"/>
    <circle cx="-55" cy="55" r="6" fill="#e879f9"/>
    <path d="M0-106L0-18M72 0L18 0M-51 51L-12 12" stroke="#c4b5fd" stroke-opacity="0.5" stroke-width="2"/>
  </g>
  <text x="86" y="132" fill="#e879f9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="7">NOVA</text>
  <text x="84" y="205" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="62" font-weight="750">System Overview</text>
  <text x="88" y="254" fill="#d8b4fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24">Self-hosted infrastructure · observability · automation · responsible AI</text>
  <text x="88" y="309" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19">A public, security-sanitized engineering portfolio by Jacque Baldenegro</text>
  <rect x="88" y="333" width="220" height="4" rx="2" fill="#a855f7"/>
  <rect x="318" y="333" width="86" height="4" rx="2" fill="#22d3ee"/>
</svg>
