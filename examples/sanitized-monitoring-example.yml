# Synthetic Prometheus example. Names and values do not represent the private system.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "example-service"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "example-service-metrics:9100"
        labels:
          environment: "portfolio-example"
          visibility: "synthetic"
